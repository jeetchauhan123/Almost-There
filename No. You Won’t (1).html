<style>

</style></head><body>
<div id="app"><div id="nar"><div class="who">NARRATOR</div><p id="nt"></p></div>
<div id="stage"><canvas id="cv" width="800" height="450"></canvas><div id="ui"></div><div id="ov"></div><div id="flash"></div><div id="tag"></div><button id="pbtn">❚❚ PAUSE</button><div id="pz"><div class="big">PAUSED</div><p class="sub">The narrator is thrilled. He needed a break too.</p><button class="btn" id="pr">RESUME</button><button class="btn alt" id="prs">RESTART SEGMENT</button><button class="btn alt" id="pm">MAIN MENU</button></div></div>

<script>
const $=s=>document.querySelector(s),rn=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rn(a,b+.999)),pick=a=>a[ri(0,a.length-1)],shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);

const cv=$('#cv'),X=cv.getContext('2d'),ui=$('#ui'),ov=$('#ov'),stage=$('#stage'),keys={};
/* ---------- audio ---------- */
let AC,mg,flt,muted=false,mood=.1,bi=0,silent=false;
function ai(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();music()}if(AC.state=='suspended')AC.resume()}catch(e){}}
function tone(f,d=.15,t='sine',v=.12,s=0,w=0){if(!AC||muted||silent)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+w;o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+s),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.02)}
function music(){mg=AC.createGain();mg.gain.value=.5;mg.connect(AC.destination);flt=AC.createBiquadFilter();flt.type='lowpass';flt.frequency.value=300;flt.connect(mg);
[55,55.6,82.4,110.3].forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(flt);o.start()});
(function b(){if(!muted&&!silent&&!paused&&mood>0)tone([55,55,65.4,49][bi++%4],.3,'sawtooth',.08+mood*.05);RST(b,650-mood*380)})()}
function setMood(m){mood=m;if(flt){flt.frequency.value=250+m*1900;mg.gain.value=(muted||silent)?0:.5}}
const sfx={click:()=>tone(520,.07,'square',.07),nar:()=>tone(880+ri(0,220),.04,'sine',.025),soft:()=>tone(440,.14,'sine',.1,120),
die:()=>{tone(300,.5,'sawtooth',.16,-250);tone(90,.4,'square',.12,-40,.05)},near:()=>{tone(660,.1,'triangle',.14);tone(520,.3,'triangle',.14,-80,.1);tone(110,.4,'sawtooth',.1,-40,.2)},
clear:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.4,'triangle',.16,0,i*.09)),
fake:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.15,0,i*.09));tone(130,.5,'sawtooth',.14,-40,.55)},
fakeWin:()=>[523,659,784,988].forEach((f,i)=>tone(f,.4,'triangle',.16,0,i*.09)),
buzz:()=>tone(110,.4,'sawtooth',.15,-30),final:()=>[262,330,392,523,659].forEach((f,i)=>tone(f,1.4,'sine',.1,0,i*.22))};
$('#mute').onclick=e=>{ai();muted=!muted;e.target.textContent=muted?'✕':'♪';setMood(mood)};
/* ---------- fx ---------- */
const PT=[];function burst(x,y,c,n=18,sp=260){for(let i=0;i<n;i++){const a=rn(0,6.28),s=rn(.2,1)*sp;PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,l:rn(.4,.9),m:.9,c})}}
function anim(c){stage.classList.remove('shake','glitch','inn');void stage.offsetWidth;stage.classList.add(c)}
function flash(c){const f=$('#flash');f.style.background=c;f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
const shake=()=>anim('shake');
/* ---------- narrator ---------- */
let lastSay=0;const nt=$('#nt');
function say(t){lastSay=performance.now();nt.textContent=t;nt.classList.remove('in');void nt.offsetWidth;nt.classList.add('in');sfx.nar()}
const L={start:["Oh, a challenger. How adorable. Try to last longer than the last one.","Welcome! I’m here to help you. (I’m not.)","Ah, fresh meat. I mean… player. Fresh player."],
fail:["Oh, you almost had it. Almost.","Interesting strategy. Wrong, but interesting.","Even a child would have gotten that by now.","I believe in you. That was a lie.","Some people just aren’t built for this.","Again? Sure. I have all day. You don’t.","That was painful to watch. I watched it twice.","Just give up. It’s fine. Nobody’s watching. Except me.","Brave. Wrong, but brave.","You’re slow. Not an insult. A measurement."],
many:["Still here? Persistent. Pointless, but persistent.","Honestly I’m starting to respect the stubbornness. Not the skill.","Every failure makes me stronger. Every single one.","Your reflexes called. They’re not coming."],
sneaky:["Did you think that was a checkpoint? Oh no. It was just a hallway. Back you go.","Progress? I forgot to save it. On purpose.","You lost a whole segment. You’re welcome.","Checkpoint? What checkpoint? Sad."],
ok:["Congratulations. That was luck.","Fine. One point for you. Zero for effort.","Oh. You did it. Don’t let it go to your head.","Beginner’s luck. Enjoy it.","Hm. I’ll make the next one harder."],
brk:["Congratulations. That didn’t count.","Did I say that was the goal? New goal.","You won! …the practice round.","Sorry, my mistake. Do it again, but faster."],
clr:["Segment cleared. Genuinely. I’m annoyed.","Okay, that one counted. Savor it.","Progress saved. Probably.","Fine. That’s real. Don’t get comfortable."],
idle:["Take your time. I’ll just be here. Judging.","Is it the keyboard? It’s usually not the keyboard.","Hurry up. Or don’t. I enjoy this.","Any day now."],
chaos:["No breaks now.","Still alive? Hm.","Let me turn it up.","Keep going. Or don’t. I win either way."]};
/* ---------- run / segments ---------- */
const TY={plat:['CONTROL','#3dd6f5'],still:['INSTRUCTION','#ffb020'],green:['INSTRUCTION','#ffb020'],count:['INSTRUCTION','#ffb020'],rapid:['HYBRID','#d65cff'],load:['TRANSITION','#9aa3b5'],fakewin:['SEGMENT','#5de08a'],rev:['REVERSE GRAVITY','#d65cff'],quiz:['QUIZ','#ffb020'],memo:['MEMORY','#ffb020'],react:['REFLEX','#ffb020'],dodge:['INSTRUCTION','#ffb020']};
let seq,idx,fails,t0,cur,run,pos=0;
function gen(){const pool=[];shuf(['grav','crumble','blink','big','spikes']).slice(0,ri(3,4)).concat(['invert']).forEach(v=>pool.push({k:'plat',v}));pool.push({k:'plat',v:'freeze'});
shuf(['still','green','count','quiz','memo','react','dodge']).slice(0,ri(5,6)).forEach(k=>pool.push({k}));pool.push({k:'rapid'},{k:'load'});for(let i=ri(1,2);i>0;i--)pool.push({k:'rev'});
for(let i=pick([1,1,2,2]);i>0;i--)pool.push({k:'fakewin'});
let a=shuf(pool);const f=a.findIndex(s=>['still','green'].includes(s.k)||(s.k=='plat'&&['invert','crumble','grav'].includes(s.v)));a.unshift(a.splice(f,1)[0]);
for(let i=0;i<2;i++)if(a[i].k=='fakewin'||a[i].k=='load'){const j=a.findIndex((s,n)=>n>2&&s.k!='fakewin');[a[i],a[j]]=[a[j],a[i]]}
a.forEach((s,i)=>{const fk=s.k=='fakewin';s.clear=!fk&&Math.random()<.5;s.brk=!fk&&s.k!='load'&&i>0&&Math.random()<.5;s.cp=i==0||s.clear||Math.random()<.45});
const parts=shuf([{k:'plat',v:'mix',tw:1},{k:'rapid',tw:1},{k:'still',tw:1},{k:'green',tw:1},{k:'count',tw:1},{k:'plat',v:'freeze',tw:1},{k:'rev',tw:1},{k:'quiz',tw:1},{k:'memo',tw:1},{k:'react',tw:1},{k:'plat',v:'big',tw:1},{k:'plat',v:'spikes',tw:1}]).slice(0,8);
if(Math.random()<.5)parts.push({k:'fakewin'});parts.push({k:'plat',v:'mix',tw:1});a.push({k:'final',parts,cp:1,clear:0});return a}
function begin(sv){ai();seq=sv?sv.seq:gen();idx=sv?sv.i:0;fails=0;sfc={};t0=Date.now();run={gs:rn(.9,1.12)};ov.innerHTML='';say(sv?"Back already? I kept your seat warm. It’s a trap.":"Let’s begin. Please don’t embarrass us both.");setTimeout(()=>runSeg(idx),1400)}
function mk(sp,part,i){const T=[],Ls=[];const S={spec:part,twist:!!(part.tw||sp.tw),dead:false,
t(f,ms){const id=setTimeout(()=>{if(!S.dead)f()},ms);T.push(id)},
l(a,b,c){a.addEventListener(b,c);Ls.push([a,b,c])},
end(){S.dead=true;T.forEach(clearTimeout);Ls.forEach(([a,b,c])=>a.removeEventListener(b,c));S.upd=null},
win(q){if(S.dead)return;S.end();won(q)},lose(m,n){if(S.dead)return;S.end();fail(m,n)}};return S}
function runSeg(i,p=0){idx=i;pos=p;const sp=seq[i],part=sp.parts?sp.parts[p]:sp;if(cur)cur.end();const S=cur=mk(sp,part,i);S.ez=Math.min(1.6,Math.max(1,1+.12*((sfc[i+':'+p]||0)-2)));setPlay(true);ui.innerHTML='';ov.innerHTML='';ov.className='';stage.classList.remove('dim');
const ty=sp.parts?['FINAL · NO MERCY','#ff4d5e']:TY[part.k];stage.style.setProperty('--ac',ty[1]);$('#tag').textContent=(part.k=='fakewin'?'':ty[0]+' · ')+'SEGMENT '+String(i+1).padStart(2,'0');
$('#ctl').classList.toggle('on',part.k=='plat');anim('inn');setMood(Math.min(1,.15+.85*i/Math.max(1,seq.length-1)));SG[part.k](S)}
function won(q){const sp=seq[idx];if(sp.parts){if(pos+1<sp.parts.length){sfx.soft();say(pick(L.chaos));return setTimeout(()=>runSeg(idx,pos+1),700)}return next()}
if(sp.brk){sp.brk=0;sp.tw=1;sfx.fake();burst(400,225,'#5de08a',30);ov.innerHTML='<div class="clr"><div class="ring">✓</div></div>';setTimeout(()=>{ov.innerHTML='';anim('glitch');sfx.buzz();say(pick(L.brk))},900);return setTimeout(()=>runSeg(idx),2200)}
if(sp.clear){sfx.clear();flash('#5de08a');burst(400,225,'#5de08a',50,380);ov.innerHTML=`<div class="clr"><div class="ring">✓</div><h2>SEGMENT ${idx+1} CLEARED</h2></div>`;say(pick(L.clr));st.s('rb',JSON.stringify({seq,i:idx+1}));return setTimeout(next,2000)}

function ending(){if(cur)cur.end();cur=null;setPlay(false);silent=true;setMood(0);ui.innerHTML='';ov.innerHTML='';ov.className='black';$('#ctl').classList.remove('on');

E.forEach((t,i)=>setTimeout(()=>say(t),1200+i*2700));
setTimeout(()=>{silent=false;setMood(.05);sfx.final();st.s('rbw',(+st.g('rbw')||0)+1);const s=Math.round((Date.now()-t0)/1000);ov.className='';stage.classList.add('dim');ov.innerHTML=`<h1 class="ttl" style="background:linear-gradient(180deg,#fff,#5de08a);-webkit-background-clip:text;background-clip:text">THE NARRATOR<br>HAS FALLEN.</h1><p class="sub">Time ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} · Failures ${fails} · Segments ${seq.length}</p><button class="btn" id="again">PLAY AGAIN (new sequence)</button>`;
stage.style.setProperty('--ac','#5de08a');[0,1,2,3].forEach(n=>setTimeout(()=>burst(rn(100,700),rn(80,300),pick(['#5de08a','#3dd6f5','#ffb020','#d65cff']),40,420),n*350));$('#again').onclick=()=>{sfx.click();silent=false;begin()}},1200+E.length*2700+1500)}
function title(){cur=null;setPlay(false);const sv=st.g('rb');say(pick(L.start));ov.innerHTML=`<h1 class="ttl">NO. YOU<br>WON’T.</h1><p class="sub">A game that hates you. Beat it anyway.<br>← → move · space jump · mouse for the rest</p><button class="btn" id="go">BEGIN</button>${sv?'<button class="btn alt" id="ct">CONTINUE FROM LAST CLEARED SEGMENT</button>':''}`;
$('#go').onclick=()=>{ai();sfx.click();begin()};if(sv)$('#ct').onclick=()=>{ai();sfx.click();try{begin(JSON.parse(sv))}catch(e){begin()}}}
/* ---------- input ---------- */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(e.repeat)return;if(playing&&cur&&(k=='escape'||k=='p')){paused?resume():pause();return}if(paused)return;keys[k]=1;if(cur&&!cur.dead&&cur.key)cur.key(e)});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==' ')e.preventDefault();delete keys[k]});

addEventListener('pointerdown',e=>{ai();if(!paused&&cur&&!cur.dead&&cur.ptr&&!e.target.closest('#ctl,#mute,#pbtn,#pz'))cur.ptr(e)});

/* ---------- segments ---------- */
const SG={};
SG.plat=S=>{const v=S.spec.v,tw=S.twist,N=(v=='mix'?10:8)+(tw?3:0),P=[{x:0,y:380,w:190,h:20,vis:1,i:0,st:0,rs:0}];let x=190,y=380;
const nc=!(v=='crumble'||v=='mix'||v=='blink'),bgv=v=='big',hf=Math.floor(N/2),tp=v=='spikes'?.9:.6;
